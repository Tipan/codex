# Build the `codex` CLI binary for this fork.
#
# This is a self-contained workflow that does not depend on the protected
# codesigning environments or self-hosted runners used by the upstream
# `rust-release.yml`. It builds a single debug/release `codex` binary on a
# GitHub-hosted macOS runner and uploads it as an artifact.
#
# Trigger it manually from the Actions tab ("Run workflow"), or it runs
# automatically on pushes to the configured branches.

name: build-codex

on:
  push:
    branches:
      - feat/max-output-tokens
      - main
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: Build codex (aarch64-apple-darwin)
    runs-on: macos-15-xlarge
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@98f714f31ff0f3e5cafd3a6731d03e5aab1f6eab # v2.8.1
        with:
          workspaces: codex-rs

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin

      - name: Cargo build (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target aarch64-apple-darwin --release --bin codex

      - name: Strip binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/aarch64-apple-darwin/release/codex"
          # Match upstream: -S removes debug symbols, -x removes local symbol
          # table entries (shrinks __LINKEDIT from ~77MB to ~13MB).
          strip -S -x "$bin"
          ls -lh "$bin"

      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          bin="target/aarch64-apple-darwin/release/codex"
          dmg_root="${RUNNER_TEMP}/codex-dmg-root"
          rm -rf "$dmg_root" && mkdir -p "$dmg_root"
          cp "$bin" "$dmg_root/codex"

          dest="dist/aarch64-apple-darwin"
          mkdir -p "$dest"
          dmg_path="$dest/codex-aarch64-apple-darwin.dmg"
          hdiutil create \
            -volname "Codex (aarch64-apple-darwin)" \
            -srcfolder "$dmg_root" \
            -format UDZO \
            -ov \
            "$dmg_path"
          ls -lh "$dmg_path"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-aarch64-apple-darwin
          path: codex-rs/dist/aarch64-apple-darwin/*
          if-no-files-found: error
