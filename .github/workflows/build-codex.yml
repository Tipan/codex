# Build the `codex` CLI binary for this fork.
#
# This is a self-contained workflow that does not depend on the protected
# codesigning environments or self-hosted runners used by the upstream
# `rust-release.yml`. It builds a single debug/release `codex` binary on a
# GitHub-hosted macOS runner and uploads it as an artifact.
#
# Trigger it manually from the Actions tab ("Run workflow"), or it runs
# automatically on pushes to the configured branches.

name: build-codex

on:
  push:
    branches:
      - feat/max-output-tokens
      - main
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: Build codex (aarch64-apple-darwin)
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin

      - name: Cargo build (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target aarch64-apple-darwin --release --bin codex

      - name: Strip binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/aarch64-apple-darwin/release/codex"
          strip -S "$bin"
          ls -lh "$bin"

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          dest="dist/aarch64-apple-darwin"
          mkdir -p "$dest"
          cp "target/aarch64-apple-darwin/release/codex" "$dest/codex-aarch64-apple-darwin"
          tar -C "$dest" -czf "$dest/codex-aarch64-apple-darwin.tar.gz" "codex-aarch64-apple-darwin"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-aarch64-apple-darwin
          path: codex-rs/dist/aarch64-apple-darwin/*
          if-no-files-found: error
