# Auto-sync with upstream openai/codex releases and build a patched binary.
#
# Runs daily (and on manual dispatch). Checks openai/codex for new stable
# release tags (rust-vX.Y.Z, excluding alpha/beta). When a new release is
# found, it:
#   1. Creates a branch from that tag
#   2. Applies the max_output_tokens patch (patches/max-output-tokens.patch)
#   3. Sets the version to <upstream-version>-maxtok
#   4. Copies in the build-codex.yml workflow
#   5. Builds the codex binary for macOS ARM64 and uploads it as an artifact
#
# The branch name build/<tag> records which upstream version was built.

name: sync-and-build

on:
  schedule:
    # Every day at 06:00 UTC (14:00 Beijing time)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (e.g. rust-v0.146.0). Leave empty to auto-detect latest."
        required: false
        default: ""

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  detect:
    name: Detect latest upstream release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect latest stable release tag
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          else
            # Query GitHub API for openai/codex tags, filter stable releases
            tags=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/openai/codex/tags?per_page=100" \
              | jq -r '.[].name' \
              | grep -E '^rust-v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V -r)
            tag=$(echo "$tags" | head -1)
          fi

          if [[ -z "$tag" ]]; then
            echo "No stable release tag found."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${tag#rust-v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest stable release: $tag (version $version)"

      - name: Check if already built
        id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.detect.outputs.tag }}"
          if [[ -z "$tag" ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="build/${tag}"
          # Check if branch already exists on mine remote
          if git ls-remote --heads "https://github.com/${{ github.repository }}.git" "$branch" | grep -q "$branch"; then
            echo "Branch $branch already exists, skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build codex ${{ needs.detect.outputs.tag }}
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: macos-15-xlarge
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.tag }}
      UPSTREAM_VERSION: ${{ needs.detect.outputs.version }}

    steps:
      - name: Checkout fork (for patch and build workflow)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure git for push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream tag
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/openai/codex.git
          git fetch upstream --tags --depth 1 "$UPSTREAM_TAG"

      - name: Save fork-only files before switching to upstream tag
        run: |
          # The upstream tag won't have our patch file or build workflow,
          # so back them up to /tmp before checking out the tag.
          mkdir -p /tmp/fork-extras/patches /tmp/fork-extras/.github/workflows
          cp patches/max-output-tokens.patch /tmp/fork-extras/patches/ 2>/dev/null || true
          cp .github/workflows/build-codex.yml /tmp/fork-extras/.github/workflows/ 2>/dev/null || true
          cp .github/workflows/sync-and-build.yml /tmp/fork-extras/.github/workflows/ 2>/dev/null || true

      - name: Create build branch from upstream tag
        run: |
          set -euo pipefail
          git checkout -b "build/${UPSTREAM_TAG}" "$UPSTREAM_TAG"

      - name: Restore fork-only files
        run: |
          cp -r /tmp/fork-extras/. .

      - name: Apply max_output_tokens patch
        run: |
          set -euo pipefail
          # Apply the core feature patch (excluding CI/version changes).
          # Use --reject so partial application is visible if upstream
          # refactored affected files.
          git apply --reject patches/max-output-tokens.patch
          # Check for rejected hunks
          if find . -name "*.rej" | grep -q .; then
            echo "::error::Patch rejected for some files. Manual update needed."
            find . -name "*.rej" -print
            exit 1
          fi

      - name: Verify upstream version
        run: |
          set -euo pipefail
          # The upstream tag already has the correct version in Cargo.toml
          # (e.g. "0.146.0"), so we keep it as-is for full compatibility.
          grep '^version' codex-rs/Cargo.toml | head -1

      - name: Commit changes
        run: |
          git add -A
          git commit -m "Apply max_output_tokens patch + build workflow for ${UPSTREAM_TAG}

          Based on upstream ${UPSTREAM_TAG} (version ${UPSTREAM_VERSION}).
          Applies patches/max-output-tokens.patch for provider-level
          max_output_tokens config support."

      - name: Push build branch
        run: |
          set -euo pipefail
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "build/${UPSTREAM_TAG}"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@98f714f31ff0f3e5cafd3a6731d03e5aab1f6eab # v2.8.1
        with:
          workspaces: codex-rs
          key: ${{ env.UPSTREAM_TAG }}

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin

      - name: Cargo build (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target aarch64-apple-darwin --release --bin codex

      - name: Strip binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/aarch64-apple-darwin/release/codex"
          strip -S -x "$bin"
          ls -lh "$bin"

      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          bin="target/aarch64-apple-darwin/release/codex"
          dmg_root="${RUNNER_TEMP}/codex-dmg-root"
          rm -rf "$dmg_root" && mkdir -p "$dmg_root"
          cp "$bin" "$dmg_root/codex"

          dest="dist/aarch64-apple-darwin"
          mkdir -p "$dest"
          dmg_path="$dest/codex-aarch64-apple-darwin.dmg"
          hdiutil create \
            -volname "Codex (aarch64-apple-darwin)" \
            -srcfolder "$dmg_root" \
            -format UDZO \
            -ov \
            "$dmg_path"
          ls -lh "$dmg_path"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-${{ needs.detect.outputs.tag }}-aarch64-apple-darwin
          path: codex-rs/dist/aarch64-apple-darwin/*
          if-no-files-found: error
